# ============================================================================
# Custodian Factory — Docker Compose
# ============================================================================
# Routes ALL AI requests through the Budget Proxy (LiteLLM).
# No direct DeepSeek access — proxy handles keys, tokens, billing.
#
# Required env vars:
#   API_SERVER_KEY  — Hermes API auth (required)
#   WEBUI_SECRET_KEY — Open WebUI secret (required)  
#   CUSTOMER_API_KEY — Customer virtual key from Budget Proxy (required)
#   BUDGET_PROXY_URL — Budget Proxy URL (default: https://budget.ns1net.com/v1)
#
# Multi-customer: PORT=8601 WEBUI_PORT=3001 CUSTOMER_ID=maria docker compose -p maria up -d
# Repository: https://github.com/blackwealthinc/custodian-deploy
# ============================================================================

services:
  hermes:
    image: nousresearch/hermes-agent:v2026.7.20  # pinned — update HERMES_PINNED_VERSION in setup script too
    container_name: ${CUSTOMER_ID:-custodian}-hermes
    restart: unless-stopped
    command: ["gateway", "run"]

    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY}
      - OPENAI_API_KEY=${CUSTOMER_API_KEY}
      - BUDGET_PROXY_URL=${BUDGET_PROXY_URL:-https://budget.ns1net.com/v1}
      - TZ=${TZ:-America/Chicago}

    volumes:
      - ./hermes-data:/opt/data

    ports:
      - "${PORT:-8642}:8642"

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8642/v1/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ${CUSTOMER_ID:-custodian}-webui
    restart: unless-stopped

    environment:
      - OPENAI_API_BASE_URL=http://hermes:8642/v1
      - OPENAI_API_KEY=${API_SERVER_KEY}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - TZ=${TZ:-America/Chicago}

    volumes:
      - ./webui-data:/app/backend/data

    ports:
      - "${WEBUI_PORT:-3000}:8080"

    depends_on:
      hermes:
        condition: service_healthy
